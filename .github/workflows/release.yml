# Builds Mnemo, signs the update manifest, and publishes a GitHub release
# when a version tag (v1.2.3) is pushed. See docs/RELEASING.md.
#
# The update key never meets npm packages: the build job installs and runs
# dependencies but has no secrets; the publish job holds the key (environment
# "release") and runs only Node built-ins, git, and gh. Third-party actions are
# pinned to commit SHAs.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      # Ad-hoc signed: there is no Developer ID. Fuses and asar integrity are
      # still checked by scripts/verify-mac-release.js (afterSign).
      - name: Build
        env:
          MNEMO_LOCAL_TEST_BUILD: "1"
        run: >-
          npx electron-builder --mac --config electron-builder.config.js --publish never
          -c.forceCodeSigning=false -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-builds
          path: |
            release/*.zip
            release/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-builds
          path: release

      # The annotated tag's message becomes the release notes, shown in the
      # app's "What's new".
      - name: Release notes
        run: |
          git fetch --no-tags --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > notes.txt
          cat notes.txt

      - name: Sign the update manifest
        env:
          MNEMO_UPDATE_PRIVATE_KEY: ${{ secrets.MNEMO_UPDATE_PRIVATE_KEY }}
        run: node scripts/make-update-manifest.js --version "$TAG" --dist release --notes-file notes.txt

      # A prerelease (v1.2.3-beta.1) is never offered by the in-app updater,
      # which only looks at the latest full release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "Mnemo ${TAG#v}" --notes-file notes.txt "${prerelease[@]}" \
            release/*.zip release/*.dmg release/update-manifest.json release/update-manifest.json.sig
